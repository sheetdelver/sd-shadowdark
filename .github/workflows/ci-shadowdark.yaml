name: Validate Module

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'module/**'
      - 'assets/**'
      - '.github/workflows/**'
      - 'info.json'
      - 'package.json'
      - 'migration.json'
      - 'migrations/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'module/**'
      - 'assets/**'
      - '.github/workflows/**'
      - 'info.json'
      - 'package.json'
      - 'migration.json'
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SHEET_DELVER_DATA: ${{ github.workspace }}/sheet-delver-core/.module-ci-data
    defaults:
      run:
        working-directory: sheet-delver-core
    steps:
      - name: Check out pinned Sheet Delver toolchain
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sheetdelver/sheetdelver
          ref: v0.19.1
          path: sheet-delver-core
          persist-credentials: false

      - name: Check out module source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sheet-delver-core/.module-ci-data/local/modules/shadowdark
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sheet-delver-core/package-lock.json

      - name: Install reviewed Sheet Delver toolchain
        run: npm ci

      - name: Generate managed configuration
        run: npm run managed:generate

      - name: Validate module contract
        run: npm run module:check -- 'shadowdark'

      - name: Run module regression tests
        run: |
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/prepared-actor.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/weapon-rules.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/actor-enricher.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/presentation.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/roll-feedback.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/importer-mapping.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/native-alignment.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/boundaries.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/effect-conformance.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/world-adoption.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/migration-hooks.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/system-index.test.ts"

      - name: Explicit module, UI and migration typing
        run: node .module-ci-data/local/modules/shadowdark/src/tests/verify-types.mjs

      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/shadowdark-browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify actual collection consumers
        run: |
          SHADOWDARK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/index.mjs" \
            node .module-ci-data/local/modules/shadowdark/src/tests/collection-consumers.browser.mjs "$RUNNER_TEMP/shadowdark-collection-results"

      - name: Verify distributable package
        run: npm run module:package -- 'shadowdark'
