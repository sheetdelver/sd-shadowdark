name: Validate Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Main and tag pushes at the same commit take turns; the second reuses the first.
concurrency:
  group: validation-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI_CORE_REF: 'v0.20.0'
      SHEET_DELVER_DATA: ${{ github.workspace }}/sheet-delver-core/.module-ci-data
    defaults:
      run:
        working-directory: sheet-delver-core
    steps:
      - name: Check out pinned Sheet Delver toolchain
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sheetdelver/sheetdelver
          ref: v0.20.0
          path: sheet-delver-core
          persist-credentials: false

      - name: Check out module source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sheet-delver-core/.module-ci-data/local/modules/shadowdark
          persist-credentials: false
          fetch-depth: 0

      - name: Check out static native Shadowdark 4.0.6 test reference
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Muttley/foundryvtt-shadowdark
          ref: 9677d16b3903b3b640f00d4efd48249142ac8334 # release-4.0.6
          path: sheet-delver-core/temp/shadowdark
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sheet-delver-core/package-lock.json

      - name: Record the selected toolchain commit
        run: echo "CI_TOOLCHAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select exact or metadata-only validation reuse
        id: reuse
        working-directory: sheet-delver-core/.module-ci-data/local/modules/shadowdark
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci-reuse.mjs "$RUNNER_TEMP/validated-release"

      - name: Test standalone release helper
        if: steps.reuse.outputs.reused != 'true'
        run: node --test .module-ci-data/local/modules/shadowdark/scripts/*.test.mjs

      - name: Install reviewed Sheet Delver toolchain
        if: steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true'
        run: npm ci

      - name: Generate managed configuration
        if: steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true'
        run: npm run managed:generate

      - name: Validate module contract
        if: steps.reuse.outputs.reused != 'true'
        run: npm run module:check -- 'shadowdark'

      - name: Run module regression tests
        if: steps.reuse.outputs.reused != 'true'
        run: |
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/prepared-actor.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/weapon-rules.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/actor-enricher.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/presentation.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/community-artwork.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/reference-view.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/roll-feedback.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/importer-mapping.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/native-alignment.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/boundaries.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/action-phases.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/languages.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/effect-conformance.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/world-adoption.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/migration-hooks.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/system-index.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/native-parity.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/advancement-recovery.test.ts"
          npx tsx ".module-ci-data/local/modules/shadowdark/src/tests/creation-validation.test.ts"

      - name: Explicit module, UI and migration typing
        if: steps.reuse.outputs.reused != 'true'
        run: node .module-ci-data/local/modules/shadowdark/src/tests/verify-types.mjs

      - name: Install isolated browser test tooling
        if: steps.reuse.outputs.reused != 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/shadowdark-browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify actual collection consumers
        if: steps.reuse.outputs.reused != 'true'
        run: |
          SHADOWDARK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/index.mjs" \
            node .module-ci-data/local/modules/shadowdark/src/tests/collection-consumers.browser.mjs "$RUNNER_TEMP/shadowdark-collection-results"

      - name: Verify action recovery and Actor lifecycle consumers
        if: steps.reuse.outputs.reused != 'true'
        run: |
          SHADOWDARK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/index.mjs" \
            node .module-ci-data/local/modules/shadowdark/src/tests/action-consumers.browser.mjs "$RUNNER_TEMP/shadowdark-action-results"
          SHADOWDARK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/index.mjs" \
            node .module-ci-data/local/modules/shadowdark/src/tests/actor-lifecycle.browser.mjs "$RUNNER_TEMP/shadowdark-actor-results"

      - name: Verify corrective advancement and spell-management consumers
        if: steps.reuse.outputs.reused != 'true'
        run: |
          SHADOWDARK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/shadowdark-browser-tools/node_modules/playwright/index.mjs" \
            node .module-ci-data/local/modules/shadowdark/src/tests/parity-corrections.browser.mjs "$RUNNER_TEMP/shadowdark-corrective-results"

      - name: Verify distributable package
        if: steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true'
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./.module-ci-data/local/modules/shadowdark/info.json').version")
          npm run module:package -- 'shadowdark' --release-tag "v$VERSION" \
            --repository "$REPOSITORY_URL" --changelog "$REPOSITORY_URL/releases/tag/v$VERSION"

      - name: Prepare validated publication files
        if: (steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true') && github.event_name != 'pull_request'
        run: |
          VERSION=$(node -p "require('./.module-ci-data/local/modules/shadowdark/info.json').version")
          OUT="$SHEET_DELVER_DATA/dist/modules"
          BUNDLE="$RUNNER_TEMP/validated-release"
          mkdir -p "$BUNDLE"
          cp "$OUT/shadowdark-$VERSION.tgz" "$OUT/shadowdark-$VERSION.sha256" "$BUNDLE/"
          cp "$OUT/shadowdark-$VERSION.manifest.json" "$BUNDLE/sheet-delver-manifest.json"
          npx esbuild src/scripts/tools/modules/generate-release-history.ts --bundle --platform=node --format=esm \
            --outfile="$BUNDLE/generate-release-history.mjs"

      - name: Bind files to this validation attempt
        id: bundle
        if: steps.reuse.outputs.exact != 'true' && github.event_name != 'pull_request'
        working-directory: sheet-delver-core/.module-ci-data/local/modules/shadowdark
        run: node scripts/ci-artifacts.mjs record "$RUNNER_TEMP/validated-release"

      - name: Retain validated publication files
        if: steps.reuse.outputs.exact != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/validated-release/*
          if-no-files-found: error
          retention-days: 30
